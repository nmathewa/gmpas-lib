<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gmpas demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#16181c;--panel:#1e2127;--line:#2c313a;--fg:#e6e8ec;--dim:#9aa3b0;--accent:#4a90d9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex}
#side{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  padding:14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
#side h1{font-size:17px;font-weight:600;margin:0}
#side h1 small{display:block;font-size:12px;font-weight:400;color:var(--dim);margin-top:2px}
label{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
select,button{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);
  border-radius:5px;padding:7px 8px;font:inherit}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
#when{font-variant-numeric:tabular-nums;font-size:14px}
#bar{height:14px;border-radius:3px}
#ticks{display:flex;justify-content:space-between;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:3px}
#flabel{margin-bottom:6px}
.hint{color:var(--dim);font-size:11.5px}
a{color:var(--accent)}
#map{flex:1;background:#0d0f12}
.leaflet-container{background:#0d0f12}
.leaflet-control-attribution{background:rgba(22,24,28,.8)!important;color:var(--dim)!important}
.leaflet-control-attribution a{color:var(--accent)!important}
@media (max-width:720px){
  body{flex-direction:column}
  #side{width:auto;border-right:none;border-bottom:1px solid var(--line);max-height:46vh}
}
</style>
</head>
<body>
<div id="side">
  <h1>gmpas demo<small id="run">loading…</small></h1>
  <div><label for="field">field</label><select id="field"></select></div>
  <div>
    <label for="t">time</label>
    <input type="range" id="t" min="0" max="0" value="0">
    <div class="row"><span id="when" style="flex:1">–</span>
      <button id="play" style="width:auto;padding:5px 14px">play</button></div>
  </div>
  <div>
    <label>colour</label>
    <div id="flabel"></div>
    <div id="bar"></div>
    <div id="ticks"></div>
  </div>
  <div class="row"><input type="checkbox" id="coast" checked style="width:auto">
    <label for="coast" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)">coastlines</label></div>
  <p class="hint">Pre-rendered from the native MPAS mesh by
    <a href="https://github.com/nmathewa/gmpas-lib" target="_blank" rel="noopener">gmpas</a>
    at about 4.9 km a pixel; nothing is computed in your browser.</p>
  <p class="hint" id="cite"></p>
  <p class="hint"><a href="https://gmpas.readthedocs.io/en/latest/" target="_blank" rel="noopener">documentation</a>
    &middot; <a href="https://github.com/nmathewa/gmpas-lib" target="_blank" rel="noopener">source</a>
    &middot; <a href="https://pypi.org/project/gmpas/" target="_blank" rel="noopener">PyPI</a></p>
  <p class="hint"><a href="regional/">interactive regional demo</a>: the real gmpas viewer,
    drawing an 8,228-cell mesh in your browser.</p>
</div>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// The page lives here, at the address already shared; the tiles live in
// nmathewa/gmpas-demo-data, published on the same github.io origin.
// ?data=<url> points it at a local copy while testing; only a loopback
// address is accepted, so a shared link cannot swap in someone else's data.
const DATA = (() => {
  const own = "https://nmathewa.github.io/gmpas-demo-data/";
  const want = new URLSearchParams(location.search).get("data");
  try {
    const u = new URL(want);
    if(["127.0.0.1", "localhost"].includes(u.hostname)) return u.href.replace(/\/?$/, "/");
  } catch(e) {}
  return own;
})();
const $ = s => document.querySelector(s);
const map = L.map("map", {crs: L.CRS.EPSG4326, minZoom: 0, maxZoom: 7, zoomSnap: 0.5,
  maxBounds: [[-100, -200], [100, 200]], worldCopyJump: false}).setView([0, 0], 1);
map.attributionControl.setPrefix(false);

let M = null, field = null, step = 0, shown = null, playing = null;
const layers = new Map();

function stamp(s){ return s.replace("_", " ").replace(/\.00\.00$/, ":00").replace(/\./, ":") + " UTC"; }

function layerFor(f, t){
  const key = f.name + "|" + t;
  if(!layers.has(key)){
    const l = L.tileLayer(`${DATA}tiles/${f.name}/${t}/{z}/{x}/{y}.webp`, {
      tileSize: 256, maxNativeZoom: f.maxzoom, maxZoom: 7, noWrap: true,
      bounds: [[-90, -180], [90, 180]], opacity: 0, keepBuffer: 1});
    l.ready = false;
    l.on("load", () => { l.ready = true; });
    layers.set(key, l);
  }
  return layers.get(key);
}

function show(){
  const t = field.times[step];
  const next = layerFor(field, t);
  $("#when").textContent = stamp(t);
  $("#t").value = step;
  if(next === shown) return;
  const prev = shown; shown = next;
  if(!map.hasLayer(next)) next.addTo(map);
  const swap = () => { next.setOpacity(1); if(prev && prev !== next) prev.setOpacity(0); };
  next.ready ? swap() : next.once("load", swap);
  // keep the next frame warm so play does not stall on it
  const pre = layerFor(field, field.times[(step + 1) % field.times.length]);
  if(!map.hasLayer(pre)) pre.addTo(map);
}

function setField(name){
  for(const l of layers.values()) map.removeLayer(l);
  layers.clear(); shown = null;
  field = M.fields.find(f => f.name === name);
  $("#t").max = field.times.length - 1;
  step = Math.min(step, field.times.length - 1);
  $("#flabel").textContent = field.label;
  $("#bar").style.background = `linear-gradient(to right, ${field.ramp.filter(c => /^#[0-9a-f]{6}$/i.test(c)).join(",")})`;
  const fmt = v => Math.abs(v) >= 1000 ? v.toLocaleString("en") : String(v);
  const mid = (field.vmin + field.vmax) / 2;
  $("#ticks").replaceChildren(...[field.vmin, mid, field.vmax].map(v => {
    const s = document.createElement("span"); s.textContent = fmt(+v); return s; }));
  show();
}

function play(){
  if(playing){ clearInterval(playing); playing = null; $("#play").textContent = "play"; return; }
  $("#play").textContent = "pause";
  playing = setInterval(() => {
    const nextT = field.times[(step + 1) % field.times.length];
    if(!layerFor(field, nextT).ready) return;          // wait for its tiles
    step = (step + 1) % field.times.length; show();
  }, 600);
}

fetch(DATA + "manifest.json").then(r => r.json()).then(m => {
  M = m;
  $("#run").textContent = `${m.run.title} · ${m.run.cells.toLocaleString("en")} cells`;
  const doi = document.createElement("a");
  doi.href = "https://doi.org/" + encodeURIComponent(m.run.doi).replace(/%2F/g, "/");
  doi.target = "_blank"; doi.rel = "noopener"; doi.textContent = "doi:" + m.run.doi;
  $("#cite").replaceChildren("Data: " + m.run.source + " ", doi);
  map.attributionControl.addAttribution('MPAS DYAMOND2 · NSF NCAR · rendered by gmpas');
  for(const f of m.fields){
    if(!f.times.length) continue;
    const o = document.createElement("option"); o.value = f.name; o.textContent = f.short || f.name; o.title = f.label; $("#field").append(o);
  }
  setField($("#field").value);
});

fetch(DATA + "data/coast.json").then(r => r.json()).then(lines => {
  const coast = L.layerGroup(lines.map(l => L.polyline(l.map(([x, y]) => [y, x]),
    {color: "#d8b25a", weight: 0.7, opacity: 0.8, interactive: false})));
  coast.addTo(map);
  $("#coast").onchange = e => e.target.checked ? coast.addTo(map) : map.removeLayer(coast);
});

$("#field").onchange = e => setField(e.target.value);
$("#t").oninput = e => { step = +e.target.value; show(); };
$("#play").onclick = play;
document.addEventListener("keydown", e => {
  if(e.target.tagName === "SELECT") return;
  if(e.key === "ArrowRight"){ step = (step + 1) % field.times.length; show(); }
  if(e.key === "ArrowLeft"){ step = (step - 1 + field.times.length) % field.times.length; show(); }
  if(e.key === " "){ e.preventDefault(); play(); }
});
</script>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmpas"
version = "0.9.0"
description = "Fast plotting of MPAS output on its own native variable-resolution mesh"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nirmal Mathew Alex", email = "nalex2023@my.fit.edu" },
    { name = "May Wong", email = "mwong@ucar.edu" },
    { name = "Jimy Dudhia", email = "dudhia@ucar.edu" },
    { name = "Pallav Ray", email = "pray@fit.edu" },
]
keywords = ["mpas", "unstructured", "voronoi", "atmosphere", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Core: geometry, caching, data access and drawing. Deliberately NOT uxarray
# (it rebuilds topology on every call) and NOT geopandas (the .npz cache
# replaces a .gpkg and also carries edge geometry). Drawing is in the base
# install, since viewing is what gmpas is for; it is imported only when
# something is drawn, so a headless remap pipeline pays no import time for it.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",        # cKDTree: exact Voronoi cell lookup
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "cftime>=1.6",         # calendar-aware Time encoding in `gmpas remap` output
    "matplotlib>=3.7",
    "cartopy>=0.22",
    "pillow>=9.0",
    "cmocean>=4.0",        # cmo.* palettes (MIT)
]

[project.scripts]
gmpas = "gmpas.cli:main"

[project.optional-dependencies]
# Conservative remapping needs ESMF_RegridWeightGen on PATH and optionally
# ncremap. Both are executables, not Python packages, so pip cannot install
# them, and neither is brought in by environment.yml either -- load your
# system's builds instead; see docs/REMAPPING.md.
# Asking for a view in words. The client only: the model is one the user
# runs on a server named in chat.conf (docs/chat.md); none is shipped.
chat = ["ollama>=0.4"]
test = ["pytest>=7.0"]
dev = ["gmpas[test,chat]", "ruff>=0.4"]
# The Read the Docs site (.readthedocs.yaml, docs/conf.py).
docs = ["sphinx>=7", "myst-parser>=2", "furo", "sphinx-copybutton",
        "sphinxcontrib-mermaid"]

[project.urls]
Homepage = "https://github.com/nmathewa/gmpas-lib"
Issues = "https://github.com/nmathewa/gmpas-lib/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gmpas"]

[tool.hatch.build.targets.sdist]
# The web demo's dataset and its baked output are for GitHub Pages, not for
# anyone installing the package: together they would take the sdist from
# 3.2 MB to about 8, downloaded by every `pip install` that builds from
# source. The scripts that make them stay in, so the demo is still readable
# from a release tarball.
# The trailing /** matters: a bare directory path here matches nothing, and
# the exclude silently does not apply. Checked by tests/test_packaging.py,
# because the failure is invisible until someone downloads the sdist.
# The docs videos are for Read the Docs, and about 5 MB.
exclude = ["docs/demo/data/**", "docs/demo/site/**", "docs/_static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # builds a wheel and an sdist, which is about a minute. Run by default
    # because what ships is worth checking; `-m "not slow"` to skip.
    "slow: builds distributions or otherwise takes real time",
]
filterwarnings = [
    # a silent nan/overflow in geometry or masking is a bug, not a warning
    "error::RuntimeWarning",
    # ...except netCDF4 built against a different numpy ABI, which warns on
    # import and has nothing to do with this package
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.ruff]
line-length = 92
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
